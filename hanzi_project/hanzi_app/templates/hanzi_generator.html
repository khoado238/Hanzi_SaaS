<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công Cụ Luyện Viết Chữ Hán - Master (V28 - HSK 3.0 Layout)</title>
    <style>
        /* ================= GIAO DIỆN CHUNG & LAYOUT ================= */
        body { 
            font-family: Arial, sans-serif; margin: 0; padding: 0;
            display: flex; height: 100vh; overflow: hidden; background-color: #525659;
        }
        
        /* CỘT TRÁI: NHẬP LIỆU */
        .left-panel {
            width: 400px; background: #ffffff; padding: 25px; box-sizing: border-box;
            border-right: 1px solid #ccc; box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            overflow-y: auto; z-index: 10; display: flex; flex-direction: column;
        }
        .left-panel h2 { margin-top: 0; color: #c62828; font-size: 24px; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .left-panel label { font-weight: bold; margin-top: 15px; display: block; color: #333; }
        .left-panel textarea { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; resize: vertical; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
        button { padding: 12px 20px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 15px; transition: 0.2s; color: white;}
        #btn-generate { background: #c62828; }
        #btn-generate:hover { background: #b71c1c; }
        #btn-generate:disabled { background: #9e9e9e; cursor: not-allowed; }
        #btn-print { background: #1976D2; }
        #btn-print:hover { background: #1565C0; }
        .hint { font-size: 13px; color: #666; margin-top: 5px; font-style: italic; line-height: 1.4; }

        /* CỘT PHẢI: XEM TRƯỚC (PREVIEW) */
        .right-panel { flex: 1; padding: 30px 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

        /* ================= CÀI ĐẶT IN ẤN ================= */
        @page { size: A4; margin: 0; } 
        
        @media print {
            body { display: block; background: white; height: auto; overflow: visible; }
            .left-panel { display: none !important; } 
            .right-panel { padding: 0; display: block; }
            .a4-page { 
                box-shadow: none !important; margin: 0 !important; width: 210mm; height: 297mm; 
                padding: 12mm 15mm 25mm 15mm !important; 
                page-break-after: always; 
            }
            .a4-page:last-child { page-break-after: auto; }
        }
        
        /* ================= KHUNG TRANG A4 ================= */
        .a4-page {
            display: block; 
            position: relative; 
            width: 210mm; height: 297mm; 
            background: white; margin-bottom: 30px;
            padding: 12mm 15mm 25mm 15mm; 
            box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Lề in 2 mặt (So le) */
        .a4-page:nth-child(odd) { padding-left: 20mm !important; padding-right: 10mm !important; }
        .a4-page:nth-child(even) { padding-left: 10mm !important; padding-right: 20mm !important; }

        /* ================= WATERMARK BẢN QUYỀN ================= */
        .watermark-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; 
            pointer-events: none; 
            z-index: 100;
        }
        .watermark-layer::after {
            content: "{{ watermark_text }}";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 110px;
            font-family: "Times New Roman", serif;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.035);
            white-space: nowrap;
            user-select: none;
        }

        /* HEADER VÀ STUDENT INFO */
        .header-title { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 12px; font-family: "Times New Roman", "KaiTi", serif; line-height: 1.4; position: relative; z-index: 1;}
        .student-info { display: flex; justify-content: space-between; font-size: 17px; font-family: "KaiTi", "Kaiti SC", STKaiti, serif; margin-bottom: 15px; padding: 0 4px; font-weight: bold; position: relative; z-index: 1; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px;}
        
        .tables-container { display: flex; flex-direction: column; width: 100%; position: relative; z-index: 1; }
        .page-number { position: absolute; bottom: 10mm; left: 0; width: 100%; text-align: center; font-size: 14px; font-family: "Times New Roman", serif; color: #333; z-index: 1;}

        /* ================= CẤU TRÚC BLOCK TỪ VỰNG MỚI (HSK 3.0 LAYOUT) ================= */
        .vocab-block { display: flex; flex-direction: column; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1.5px solid #eee; page-break-inside: avoid; }
        
        /* 1. Header Của Mỗi Từ (Chữ lớn, Pinyin, Nghĩa) */
        .v-header { display: flex; gap: 15px; align-items: flex-start; margin-bottom: 10px; }
        .v-left { display: inline-flex; flex-direction: column; border: 1.5px solid #333; border-radius: 2px; overflow: hidden; }
        .big-chars { display: flex; }
        .big-char { 
            width: 44px; height: 44px; font-size: 34px; font-family: "KaiTi", "Kaiti SC", STKaiti, serif; 
            display: flex; align-items: center; justify-content: center; border-right: 1.5px solid #333; 
        }
        .big-char:last-child { border-right: none; }
        .v-idx { background: #ffe599; font-size: 13px; font-weight: bold; text-align: center; padding: 2px 0; border-top: 1.5px solid #333; }
        
        .v-info { flex: 1; display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
        .info-row-1 { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .pinyin { font-weight: bold; font-size: 16px; color: #111; font-family: "Arial", sans-serif; }
        .total-strokes { font-size: 13px; font-style: italic; color: #555; }
        .info-row-2 { display: flex; }
        .meaning { font-weight: bold; font-size: 14px; color: #111; font-family: "Times New Roman", serif; }

        /* 2. Thứ tự nét bút (Stroke Order) */
        .v-strokes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .stroke-char-row { display: flex; flex-wrap: wrap; }
        .tiny-tzg {
            width: 24px; height: 24px; 
            border: 1px solid #777; border-right: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" shape-rendering="crispEdges"><line x1="50%" y1="0" x2="50%" y2="100%" stroke="%23e0e0e0" stroke-dasharray="1.5,1.5" stroke-width="0.6"/><line x1="0" y1="50%" x2="100%" y2="50%" stroke="%23e0e0e0" stroke-dasharray="1.5,1.5" stroke-width="0.6"/></svg>'); 
            background-size: 100% 100%;
        }
        .stroke-char-row .tiny-tzg:last-child { border-right: 1px solid #777; }
        .stroke-svg { width: 100%; height: 100%; display: block; }

        /* 3. Lưới tập viết (Grouped Boxes) */
        .v-practice { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .word-group { display: flex; border: 1.5px solid #555; } /* Viền đậm cho mỗi cụm */
        .tzg-box {
            width: 44px; height: 44px; 
            border-right: 1px solid #999; /* Viền nhạt ngăn cách chữ bên trong cụm */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" shape-rendering="crispEdges"><line x1="50%" y1="0" x2="50%" y2="100%" stroke="%23e0e0e0" stroke-dasharray="2,2" stroke-width="1"/><line x1="0" y1="50%" x2="100%" y2="50%" stroke="%23e0e0e0" stroke-dasharray="2,2" stroke-width="1"/></svg>'); 
            background-size: 100% 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: "KaiTi", "Kaiti SC", STKaiti, serif; font-size: 32px; color: #000;
        }
        .word-group .tzg-box:last-child { border-right: none; }
        .trace-text { color: rgba(0,0,0,0.25); }

        /* 4. Dòng luyện viết tự do */
        .v-free { display: flex; align-items: flex-end; margin-top: 5px; gap: 10px; }
        .free-label { font-size: 14px; color: #111; white-space: nowrap; font-family: "Times New Roman", serif; font-weight: bold;}
        .dotted-line { flex: 1; border-bottom: 1.5px dotted #999; height: 10px; margin-bottom: 3px;}
    </style>
</head>
<body>

<div class="left-panel no-print">
    <h2>LUYỆN VIẾT CHỮ HÁN</h2>
    
    <label>Tên bài học:</label>
    <textarea id="lessonTitle" rows="2">第一课、
Bài 1: AI小语，你好！</textarea>
    
    <label>Danh sách từ vựng:</label>
    <div class="hint">Copy 3 cột từ Excel/Google Sheets dán vào đây.<br><b>Thứ tự:</b> Chữ Hán | Pinyin | Nghĩa</div>
    <textarea id="vocabList" rows="12">你好	nǐhǎo	xin chào; chào bạn
大家	dàjiā	mọi người
好	hǎo	tốt; khỏe
不客气	bú kèqi	đừng khách sáo</textarea>
    
    <div class="btn-group">
        <button id="btn-generate" onclick="generateSheet()">🔄 Cập nhật Xem Trước</button>
        <button id="btn-print" onclick="window.print()">🖨️ In / Xuất file PDF</button>
    </div>
</div>

<div class="right-panel" id="outputContainer">
    <!-- Nội dung sẽ render tại đây -->
</div>

<script>
    const hanziCache = {};

    // Khởi tạo tải dữ liệu từ CDN
    async function fetchHanziData(char) {
        if (hanziCache[char]) return hanziCache[char]; 
        try {
            const res = await fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${char}.json`);
            if (res.ok) {
                const data = await res.json();
                hanziCache[char] = data; 
                return data;
            }
        } catch (e) { console.error("Lỗi tải chữ:", char); }
        return null;
    }

    // Vẽ SVG dãy nét bút cho 1 chữ (Hiển thị kiểu các ô nhỏ liền kề)
    function createStrokeHtml(data) {
        if (!data) return '';
        const strokes = data.strokes;
        let html = `<div class="stroke-char-row">`;
        for (let i = 0; i < strokes.length; i++) {
            html += `<div class="tiny-tzg"><svg viewBox="0 0 1024 1024" class="stroke-svg">`;
            html += `<g transform="scale(1, -1) translate(0, -900)">`;
            for (let j = 0; j <= i; j++) {
                const strokeColor = (j === i) ? "#f25c54" : "#000000"; 
                html += `<path d="${strokes[j]}" fill="${strokeColor}"></path>`;
            }
            html += `</g></svg></div>`;
        }
        html += `</div>`;
        return html;
    }

    // Hàm tạo khối HTML cho 1 cụm từ vựng (Layout Mới)
    function generateVocabHTML(line, index) {
        const parts = line.split(/\t|\|/);
        const word = (parts[0] || "").replace(/\s/g, ''); 
        const pinyinStr = (parts[1] || "").trim();
        const meaning = (parts[2] || "").trim(); 
        
        const chars = word.split(''); 
        const N = chars.length;
        if (N === 0) return '';

        let totalStrokes = 0;
        let strokeContentHtml = '';
        let bigCharsHtml = '';
        
        chars.forEach(char => {
            bigCharsHtml += `<div class="big-char">${char}</div>`;
            if (/[，。！？、]/g.test(char)) return; 
            const data = hanziCache[char];
            if (data) {
                totalStrokes += data.strokes.length;
                strokeContentHtml += createStrokeHtml(data);
            }
        });

        // Định dạng chỉ số (01, 02...)
        const idxStr = index.toString().padStart(2, '0');

        // Tính toán số lượng cụm (group) dựa trên độ rộng giấy A4 (~14 ô)
        const maxCells = 14; 
        let groupCount = Math.floor(maxCells / N);
        if (groupCount < 1) groupCount = 1;

        // Sinh HTML cho lưới viết (Chia cụm theo số chữ Hán)
        let practiceHtml = `<div class="v-practice">`;
        for (let i = 0; i < groupCount; i++) {
            practiceHtml += `<div class="word-group">`;
            chars.forEach(char => {
                // Cụm đầu tiên luôn in mờ để đồ chữ (trace)
                if (i === 0) {
                    practiceHtml += `<div class="tzg-box trace-text">${char}</div>`;
                } else {
                    practiceHtml += `<div class="tzg-box"></div>`;
                }
            });
            practiceHtml += `</div>`;
        }
        practiceHtml += `</div>`;

        // Lắp ráp toàn bộ UI Block
        return `
        <div class="vocab-block">
            <div class="v-header">
                <div class="v-left">
                    <div class="big-chars">${bigCharsHtml}</div>
                    <div class="v-idx">${idxStr}</div>
                </div>
                <div class="v-info">
                    <div class="info-row-1">
                        <span class="pinyin">${pinyinStr}</span>
                        <span class="total-strokes">Số nét: ${totalStrokes}</span>
                    </div>
                    <div class="info-row-2">
                        <span class="meaning">Nghĩa: ${meaning}</span>
                    </div>
                </div>
            </div>
            <div class="v-strokes">
                ${strokeContentHtml}
            </div>
            ${practiceHtml}
            <div class="v-free">
                <span class="free-label">Luyện viết tự do:</span> <div class="dotted-line"></div>
            </div>
        </div>
        `;
    }

    async function generateSheet() {
        try {
            const btn = document.getElementById('btn-generate');
            btn.innerText = "⏳ Đang tự động chia trang...";
            btn.disabled = true;

            const titleRaw = document.getElementById('lessonTitle').value;
            const titleHtml = titleRaw.replace(/\n/g, '<br>');
            const vocabRaw = document.getElementById('vocabList').value.trim().split('\n');
            const validVocabs = vocabRaw.filter(line => line.includes('|') || line.includes('\t'));
            
            // Tải trước dữ liệu SVG
            let allChars = [];
            validVocabs.forEach(line => {
                const parts = line.split(/\t|\|/);
                const word = (parts[0] || "").replace(/\s/g, '');
                allChars.push(...word.split(''));
            });
            const uniqueChars = [...new Set(allChars.filter(c => !/[，。！？、]/.test(c)))];
            await Promise.all(uniqueChars.map(char => fetchHanziData(char)));

            // DOM & Chia trang
            const outputContainer = document.getElementById('outputContainer');
            outputContainer.innerHTML = '';

            function createPageElement() {
                const page = document.createElement('div');
                page.className = 'a4-page';
                page.innerHTML = `
                    <div class="watermark-layer"></div>
                    <div class="header-title">${titleHtml}</div>
                    <div class="student-info">
                        <span>姓名：</span>
                        <span>年&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;月&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;日</span>
                    </div>
                    <div class="tables-container"></div>
                    <div class="page-number"></div>
                `;
                return page;
            }

            let pageNum = 1;
            let currentPage = createPageElement();
            outputContainer.appendChild(currentPage);
            let tablesContainer = currentPage.querySelector('.tables-container');

            for (let idx = 0; idx < validVocabs.length; idx++) {
                const line = validVocabs[idx].trim();
                // Sử dụng hàm render mới, truyền thêm index (bắt đầu từ 1)
                const vocabHtml = generateVocabHTML(line, idx + 1); 
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = vocabHtml.trim();
                const vocabNode = tempDiv.firstElementChild;
                
                tablesContainer.appendChild(vocabNode);
                
                const pageRect = currentPage.getBoundingClientRect();
                const tablesRect = tablesContainer.getBoundingClientRect();
                
                // Thuật toán tách trang
                if (tablesRect.bottom > pageRect.bottom - 80 && tablesContainer.children.length > 1) {
                    tablesContainer.removeChild(vocabNode);
                    currentPage.querySelector('.page-number').innerText = `- ${pageNum} -`;
                    
                    pageNum++; 
                    currentPage = createPageElement();
                    outputContainer.appendChild(currentPage);
                    tablesContainer = currentPage.querySelector('.tables-container');
                    
                    tablesContainer.appendChild(vocabNode); 
                }
            }
            
            // Đánh số trang cho trang cuối
            if (currentPage) {
                currentPage.querySelector('.page-number').innerText = `- ${pageNum} -`;
            }

            btn.innerText = "🔄 Cập nhật Xem Trước";
            btn.disabled = false;
        } catch (error) {
            alert("Lỗi: " + error.message);
            document.getElementById('btn-generate').disabled = false;
        }
    }

    window.onload = generateSheet;
</script>

</body>
</html>
